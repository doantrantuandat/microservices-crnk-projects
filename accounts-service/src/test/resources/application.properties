# Tests use H2 in-memory, not the real Postgres container - keeps `mvn test` fast and independent of
# docker-compose being up. Overrides src/main/resources/application.properties on the test classpath.
spring.datasource.url=jdbc:h2:mem:accountsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
