services:
  accounts-db:
    image: postgres:16
    environment:
      POSTGRES_DB: accountsdb
      POSTGRES_USER: crnk
      POSTGRES_PASSWORD: crnk
    ports:
      - "25432:5432"

  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: crnk
      POSTGRES_PASSWORD: crnk
    ports:
      - "25433:5432"

  ordering-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderingdb
      POSTGRES_USER: crnk
      POSTGRES_PASSWORD: crnk
    ports:
      - "25434:5432"

  accounts-service:
    build: ./accounts-service
    ports:
      - "28081:8080"
    environment:
      # No depends_on: ordering-service here - ordering-service's own depends_on already points at
      # accounts-service, and Compose rejects a circular depends_on graph. Account.orders resolution is
      # fail-open at the app level regardless of startup order.
      ORDERING_SERVICE_URL: http://ordering-service:8080
      DB_HOST: accounts-db
      DB_PORT: "5432"
    depends_on:
      - accounts-db

  catalog-service:
    build: ./catalog-service
    ports:
      - "28082:8080"
    environment:
      ACCOUNTS_SERVICE_URL: http://accounts-service:8080
      DB_HOST: catalog-db
      DB_PORT: "5432"
    depends_on:
      - accounts-service
      - catalog-db

  ordering-service:
    build: ./ordering-service
    ports:
      - "28083:8080"
    environment:
      ACCOUNTS_SERVICE_URL: http://accounts-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      DB_HOST: ordering-db
      DB_PORT: "5432"
    depends_on:
      - accounts-service
      - catalog-service
      - ordering-db

  storefront-gateway:
    build: ./storefront-gateway
    ports:
      - "28080:8080"
    environment:
      ACCOUNTS_SERVICE_URL: http://accounts-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      ORDERING_SERVICE_URL: http://ordering-service:8080
    depends_on:
      - accounts-service
      - catalog-service
      - ordering-service
